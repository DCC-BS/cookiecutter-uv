name: Main

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    APP_MODE: "ci"
    AUTH_MODE: "none"

permissions:
    contents: read

jobs:
    backend-ci:
        # ci.yml v10 has no run-build/run-check inputs (they made every run end in
        # startup_failure); it skips build/check on its own when the mise tasks don't exist.
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@4594d0b9ddf95dcd54c25e599f927d5a23ae7950 # v10.0.6
        permissions:
            contents: read
            pull-requests: write
