name: Main

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    APP_MODE: "ci"
    AUTH_MODE: "none"

permissions:
    contents: read

jobs:
    backend-ci:
        # ci.yml v10 has no run-build/run-check inputs (they made every run end in
        # startup_failure); it skips build/check on its own when the mise tasks don't exist.
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@e4b0133a84dbb31d57dd2389f22fce8b85cf55b7 # v10.0.4
        permissions:
            contents: read
            pull-requests: write
