name: Main

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    APP_MODE: "ci"
    AUTH_MODE: "none"

permissions:
    contents: read

jobs:
    backend-ci:
        # ci.yml v10 has no run-build/run-check inputs (they made every run end in
        # startup_failure); it skips build/check on its own when the mise tasks don't exist.
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@8b031be53aee5210c6b392115bd941c80e798d60 # v10.0.1
        permissions:
            contents: read
            pull-requests: write
