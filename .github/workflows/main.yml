name: Main

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    APP_MODE: "ci"
    AUTH_MODE: "none"

jobs:
    backend-ci:
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@b0f3abf4e131b4834279fb3ba3b4ecf366c52fdc #v10
        with:
            python_versions: '["3.14"]'
            quality_python_version: "3.14"
            check_command: "make check"
            uv_version: 0.9.28
