[tools]
python = "3.13"
usage = "3.5.6"
uv = "0.11.31"

[hooks]
postinstall = { task = "install" }

# ── Setup ─────────────────────────────────────────────────────────────────────

[tasks.install]
description = "Create the virtual environment and install the pre-commit hooks"
alias = "i"
sources = ["pyproject.toml", "uv.lock"]
outputs = [".venv"]
run = [
    "uv sync",
]

# ── Quality ───────────────────────────────────────────────────────────────────

[tasks.check]
description = "Verify lockfile, format code, lint, and type-check without modifying files"
run = [
    "uv lock --locked",
    "uv run ruff format --check",
    "uv run ruff check",
    "uv run ty check ./hooks",
]

# ── Testing ───────────────────────────────────────────────────────────────────

[tasks."test:unit"]
description = "Run the test suite (including doctests)"
alias = "t"
env = { APP_MODE = "ci" }
run = "uv run python -m pytest --doctest-modules"
